syntax = "proto3";

package warehouse.v1;

// العقد المشترك بين التطبيق الأساسي (Laravel) وخدمة المستودع (Python)
service Warehouse {
  // كم بقي من هذا المنتج؟
  rpc GetStock(GetStockRequest) returns (GetStockResponse);

  // احجز كميات كل منتجات الطلب بطلب واحد: كلها أو لا شيء
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // أعد الكميات المحجوزة (إذا فشل حفظ الطلب). آمن لو انعادت أكثر من مرة
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message GetStockRequest {
  int64 product_id = 1;
}

message GetStockResponse {
  int64 product_id = 1;
  int32 available = 2;
}

message StockItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  // معرّف فريد (UUID) يولّده التطبيق ويربط الحجز بالطلب
  string reservation_id = 1;
  repeated StockItem items = 2;
}

message ReserveStockResponse {
  bool reserved = 1;
  // إذا reserved = false: المنتجات اللي كميتها ما كفت
  repeated StockShortage shortages = 2;
}

message StockShortage {
  int64 product_id = 1;
  int32 requested = 2;
  int32 available = 3;
}

message ReleaseStockRequest {
  string reservation_id = 1;
}

message ReleaseStockResponse {
  bool released = 1;
}